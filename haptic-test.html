<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>震動實驗</title>
<style>
    body { margin: 0; padding: 16px; background: #000; color: #fff; font-family: -apple-system, sans-serif; }
    .pad { position: relative; margin: 12px 0; padding: 36px 16px; border-radius: 14px; background: #333; font-size: 18px; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; }
    .pad small { display: block; color: #aaa; margin-top: 6px; font-size: 14px; }
    .cover { position: absolute; inset: 0; }
    .cover input { opacity: 0.01; width: 1px; height: 1px; margin: 0; }
    .whole { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0.01; }
    #log { color: #ff9500; font-size: 14px; white-space: pre-line; }
</style>
</head>
<body>
<p>G、H 各做兩次：① 點一下 ② 按住 3 秒再放開。記下有沒有震、是按下、按住中還是放開時震。</p>
<div class="pad">E. 直接點這個開關 <input type="checkbox" switch><small>對照組，你已確認會震</small></div>
<div class="pad" id="g">G. 點這塊<small>整塊是看不見的開關標籤</small><label class="cover"><input type="checkbox" switch data-name="G"></label></div>
<div class="pad" id="h">H. 點這塊<small>整塊就是一個看不見的開關</small><input class="whole" type="checkbox" switch data-name="H"></div>
<div id="log"></div>
<script>
const log = msg => { document.getElementById('log').textContent = msg + '\n' + document.getElementById('log').textContent; };
let downAt = 0;
const since = () => ((Date.now() - downAt) / 1000).toFixed(1) + ' 秒';
for (const id of ['g', 'h']) {
    const pad = document.getElementById(id);
    pad.addEventListener('touchstart', () => { downAt = Date.now(); log(id.toUpperCase() + ' 按下'); });
    pad.addEventListener('touchend', () => log(id.toUpperCase() + ' 放開（按了 ' + since() + '）'));
}
document.querySelectorAll('[data-name]').forEach(input => input.addEventListener('change', () => log(input.dataset.name + ' 開關切換（按下後 ' + since() + '）')));
</script>
</body>
</html>
